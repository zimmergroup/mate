id = "mosquitto-tls"
name = "Mosquitto TLS"
description = "TLS with password from the operating-system keyring"
host = "mqtt.example.local"
port = 8883
protocol = "mqtt311"
client_id = "mate-mosquitto-tls"

[tls]
enabled = true
ca_file = "certs/ca.pem"

[auth]
username = "mate"
password_ref = "keyring:mosquitto-tls"

[[subscriptions]]
topic = "#"
qos = 0