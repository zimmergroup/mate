id = "mosquitto-mtls"
name = "Mosquitto mTLS"
description = "Mutual TLS client authentication"
host = "mqtt-mtls.example.local"
port = 8883
protocol = "mqtt311"
client_id = "mate-mosquitto-mtls"

[tls]
enabled = true
ca_file = "certs/ca.pem"
client_cert = "certs/client.crt"
client_key = "certs/client.key"

[[subscriptions]]
topic = "#"
qos = 0